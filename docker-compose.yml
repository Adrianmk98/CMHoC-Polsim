version: '3.8'

services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
    container_name: cmhoc_cloud_sql_proxy
    command: --address 0.0.0.0 --port 5432 ${CLOUD_SQL_CONNECTION_NAME}
    restart: unless-stopped
    networks:
      - cmhoc_network

  web:
    build: .
    container_name: cmhoc_web
    command: gunicorn CMHoC_Polsim.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - DB_NAME=cmhoc_polsim_db
      - DB_USER=polsim_user
      - DB_HOST=cloud-sql-proxy
      - DB_PORT=5432
    depends_on:
      - cloud-sql-proxy
    restart: unless-stopped
    networks:
      - cmhoc_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cmhoc_cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - cmhoc_network

  watchtower:
    image: containrrr/watchtower
    container_name: cmhoc_watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --label-enable
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:

networks:
  cmhoc_network:
    driver: bridge
