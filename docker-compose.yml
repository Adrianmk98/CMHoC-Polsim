version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cmhoc_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=cmhoc_db
      - POSTGRES_USER=cmhoc_user
      - POSTGRES_PASSWORD=YOUR_SECURE_PASSWORD_HERE
    restart: unless-stopped
    networks:
      - cmhoc_network

  web:
    build: .
    container_name: cmhoc_web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://cmhoc_user:YOUR_SECURE_PASSWORD_HERE@db:5432/cmhoc_db
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - cmhoc_network

volumes:
  postgres_data:
  static_volume:

networks:
  cmhoc_network:
    driver: bridge