version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cmhoc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: cmhoc_polsim_db
      POSTGRES_USER: polsim_user
      POSTGRES_PASSWORD: YourAppPassword123
    restart: unless-stopped
    networks:
      - cmhoc_network

  web:
    build: .
    container_name: cmhoc_web
    command: gunicorn CMHoC_Polsim.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://polsim_user:YourAppPassword123@db:5432/cmhoc_polsim_db
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - cmhoc_network

  # nginx removed - using Cloudflare tunnel instead

  watchtower:
    image: containrrr/watchtower
    container_name: cmhoc_watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  cmhoc_network:
    driver: bridge