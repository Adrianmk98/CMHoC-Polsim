version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cmhoc_db
    environment:
      - POSTGRES_DB=cmhoc_polsim_db
      - POSTGRES_USER=polsim_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - cmhoc_network

  web:
    image: ghcr.io/adrianmk98/cmhoc-polsim:latest
    container_name: cmhoc_web
    command: gunicorn CMHoC_Polsim.wsgi:application --bind 0.0.0.0:8000 --workers 4
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env
    environment:
      - DB_NAME=cmhoc_polsim_db
      - DB_USER=polsim_user
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - cmhoc_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cmhoc_cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - cmhoc_network

  watchtower:
    image: containrrr/watchtower
    container_name: cmhoc_watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --label-enable
    restart: unless-stopped

volumes:
  static_volume:
  postgres_data:

networks:
  cmhoc_network:
    driver: bridge
