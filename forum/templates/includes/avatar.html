{% if avatar_user.profile.avatar %}
    <img src="{{ avatar_user.profile.avatar.url }}" alt="{{ avatar_user.username }}" class="rounded-circle" style="width: {{ size|default:32 }}px; height: {{ size|default:32 }}px; object-fit: cover;">
{% else %}
    <span class="rounded-circle bg-secondary text-white d-inline-flex align-items-center justify-content-center" style="width: {{ size|default:32 }}px; height: {{ size|default:32 }}px; font-size: {% widthratio size|default:32 2 1 %}px;">
        {{ avatar_user.username|slice:":1"|upper }}
    </span>
{% endif %}
