{% extends 'mod_base.html' %}

{% block title %}Create Cabinet - Moderator{% endblock %}

{% block mod_content %}
<div class="row">
    <div class="col-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'moderator:dashboard' %}">Moderator</a></li>
                <li class="breadcrumb-item"><a href="{% url 'moderator:cabinet_dashboard' %}">Cabinet</a></li>
                <li class="breadcrumb-item active">Create Cabinet</li>
            </ol>
        </nav>
    </div>
</div>

<div class="card">
    <div class="card-header bg-success text-white">
        <h4 class="mb-0">Create New Cabinet</h4>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Cabinet Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" placeholder="e.g. 33rd Canadian Ministry" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Prime Minister</label>
                    <select name="prime_minister" class="form-select">
                        <option value="">-- None --</option>
                        {% for profile in all_profiles %}
                        <option value="{{ profile.id }}">{{ profile.user.username }}{% if profile.party %} ({{ profile.party.name }}){% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Government Party</label>
                    <select name="government_party" class="form-select">
                        <option value="">-- None --</option>
                        {% for party in parties %}
                        <option value="{{ party.id }}">{{ party.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Start Date <span class="text-danger">*</span></label>
                    <input type="date" name="start_date" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3 d-flex align-items-end">
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="is_current" value="1" id="is_current">
                        <label class="form-check-label" for="is_current">Mark as current cabinet</label>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Create Cabinet</button>
                <a href="{% url 'moderator:cabinet_dashboard' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
