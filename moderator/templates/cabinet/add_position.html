{% extends 'mod_base.html' %}

{% block title %}Add Position - Moderator{% endblock %}

{% block mod_content %}
<div class="row">
    <div class="col-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'moderator:dashboard' %}">Moderator</a></li>
                <li class="breadcrumb-item"><a href="{% url 'moderator:cabinet_dashboard' %}">Cabinet</a></li>
                <li class="breadcrumb-item active">Add Position</li>
            </ol>
        </nav>
    </div>
</div>

<div class="card">
    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Add Position to: {{ cabinet.name }}</h4>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Member <span class="text-danger">*</span></label>
                    <select name="user_profile" class="form-select" required>
                        <option value="">-- Select member --</option>
                        {% for profile in all_profiles %}
                        <option value="{{ profile.id }}">{{ profile.user.username }}{% if profile.party %} ({{ profile.party.name }}){% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Position Type <span class="text-danger">*</span></label>
                    <select name="position_type" class="form-select" required>
                        <option value="">-- Select type --</option>
                        {% for value, label in position_types %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Portfolio <span class="text-danger">*</span></label>
                    <input type="text" name="portfolio" class="form-control" placeholder="e.g. Finance" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Full Title <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. Minister of Finance" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Start Date <span class="text-danger">*</span></label>
                    <input type="date" name="start_date" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Sort Order</label>
                    <input type="number" name="order" class="form-control" value="0">
                    <small class="text-muted">Lower = higher in list (PM=1)</small>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="2"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Add Position</button>
                <a href="{% url 'moderator:cabinet_dashboard' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
