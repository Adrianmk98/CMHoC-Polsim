{% extends 'mod_base.html' %}

{% block title %}Edit User - Moderator{% endblock %}

{% block mod_content %}
<div class="row">
    <div class="col-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'moderator:dashboard' %}">Moderator</a></li>
                <li class="breadcrumb-item"><a href="{% url 'moderator:user_dashboard' %}">Users</a></li>
                <li class="breadcrumb-item active">{{ profile.user.username }}</li>
            </ol>
        </nav>
    </div>
</div>

<div class="card">
    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Edit: {{ profile.user.username }}</h4>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Party</label>
                    <select name="party" class="form-select">
                        <option value="">-- None --</option>
                        {% for party in parties %}
                        <option value="{{ party.id }}" {% if party.id == profile.party_id %}selected{% endif %}>{{ party.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Riding</label>
                    <select name="riding" class="form-select">
                        <option value="">-- None --</option>
                        {% for riding in ridings %}
                        <option value="{{ riding.id }}" {% if riding.id == profile.riding_id %}selected{% endif %}>{{ riding.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Role</label>
                <input type="text" name="role" class="form-control" value="{{ profile.role }}" placeholder="e.g. MP, Senator, Minister">
            </div>
            <div class="mb-3">
                <label class="form-label">Bio</label>
                <textarea name="bio" class="form-control" rows="3">{{ profile.bio }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{% url 'moderator:user_dashboard' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
