{% extends 'mod_base.html' %}

{% block title %}End Position - Moderator{% endblock %}

{% block mod_content %}
<div class="card">
    <div class="card-header bg-danger text-white">
        <h4 class="mb-0">End Position</h4>
    </div>
    <div class="card-body">
        <p>End <strong>{{ position.position_title }}</strong> for <strong>{{ position.user_profile.user.username }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">End Date</label>
                <input type="date" name="end_date" class="form-control">
                <small class="text-muted">Leave blank to use today.</small>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">End Position</button>
                <a href="{% url 'moderator:position_dashboard' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
