{% extends 'mod_base.html' %}

{% block title %}Edit Position - Moderator{% endblock %}

{% block mod_content %}
<div class="row">
    <div class="col-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'moderator:dashboard' %}">Moderator</a></li>
                <li class="breadcrumb-item"><a href="{% url 'moderator:position_dashboard' %}">Positions</a></li>
                <li class="breadcrumb-item active">Edit</li>
            </ol>
        </nav>
    </div>
</div>

<div class="card">
    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Edit: {{ position.position_title }} ({{ position.user_profile.user.username }})</h4>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Member</label>
                    <select name="user_profile" class="form-select">
                        {% for profile in all_profiles %}
                        <option value="{{ profile.id }}" {% if profile.id == position.user_profile_id %}selected{% endif %}>{{ profile.user.username }}{% if profile.party %} ({{ profile.party.name }}){% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Position Type</label>
                    <select name="position_type" class="form-select">
                        {% for value, label in position_types %}
                        <option value="{{ value }}" {% if value == position.position_type %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Position Title</label>
                    <input type="text" name="position_title" class="form-control" value="{{ position.position_title }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Riding (optional)</label>
                    <select name="riding_obj" class="form-select">
                        <option value="">-- None --</option>
                        {% for riding in ridings %}
                        <option value="{{ riding.id }}" {% if riding.id == position.riding_obj_id %}selected{% endif %}>{{ riding.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start_date" class="form-control" value="{{ position.start_date|date:'Y-m-d' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="end_date" class="form-control" value="{{ position.end_date|date:'Y-m-d' }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="2">{{ position.notes }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{% url 'moderator:position_dashboard' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
