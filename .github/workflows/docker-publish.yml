name: Build and publish Docker image

on:
  push:
    branches: [main]

env:
  # GHCR requires a lowercase image path, so this is hardcoded rather than
  # derived from github.repository_owner (which preserves GitHub's casing).
  IMAGE_NAME: ghcr.io/adrianmk98/cmhoc-polsim

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
